[package]
name = "trailbase-schema"
version = "0.1.0"
edition = "2024"
license = "OSL-3.0"
description = "Schema utilities for the TrailBase framework"
homepage = "https://trailbase.io"
repository = "https://github.com/trailbaseio/trailbase"
readme = "../../README.md"

[features]
default = []

[dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
fallible-iterator = "0.3.0"
infer = "0.22.0"
itertools = { workspace = true }
jsonschema = { version = "0.52.1", default-features = false }
lazy_static = "1.5.0"
log = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
regex = "1.13.1"
schemars = "1.2.2"
serde = { workspace = true }
serde_json = { workspace = true }
sqlite3-parser = { workspace = true }
thiserror = "2.0.20"
trailbase-extension = { workspace = true }
trailbase-sqlite = { workspace = true }
ts-rs = { workspace = true }
utoipa = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
anyhow = "1.0.104"
indoc = "2.0.7"
litegis = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
