[package]
name = "trailbase-wasm"
version = "0.6.1"
edition = "2024"
license = "OSL-3.0"
description = "WASM runtime for the TrailBase framework"
homepage = "https://trailbase.io"
repository = "https://github.com/trailbaseio/trailbase"
readme = "../../README.md"

[dependencies]
base64 = { workspace = true }
bytes = { version = "1.12.1", default-features = false }
