http = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1.20"
serde_urlencoded = "0.7.1"
static_assertions = "1.1.0"
thiserror = "2.0.20"
trailbase-sqlvalue = { workspace = true }
trailbase-wasm-common = { workspace = true }
url = "2.5.8"
wit-bindgen = "0.61.1"
wstd = "=0.5.6"
