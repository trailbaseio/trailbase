<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="description" content="Trailbase Admin Dashboard" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f0f4f7" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#151c28"
    />

    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />

    <title>TrailBase Admin</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("theme:selected");
          const theme = stored ? JSON.parse(stored) : undefined;
          const resolved =
            theme ??
            (matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light");
          if (resolved === "dark")
            document.documentElement.classList.add("dark");
          document.documentElement.setAttribute("data-kb-theme", resolved);
          document
            .querySelector('meta[name="theme-color"]:not([media])')
            ?.setAttribute(
              "content",
              resolved === "dark" ? "#151c28" : "#f0f4f7",
            );
        } catch (_) {}
      })();
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
