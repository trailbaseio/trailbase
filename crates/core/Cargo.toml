[package]
name = "trailbase"
version = "0.2.0"
edition = "2024"
license = "OSL-3.0"
rust-version = "1.95"
description = "Package to use TrailBase as a framework"
homepage = "https://trailbase.io"
repository = "https://github.com/trailbaseio/trailbase"
readme = "../../README.md"
exclude = [
  "benches/",
  "tests/",
  "**/node_modules/",
  "**/dist/",
]
autobenches = false

[lib]
doctest = false

[[bench]]
name = "benchmark"
harness = false

[features]
default = []
otel = ["dep:axum-tracing-opentelemetry", "dep:init-tracing-opentelemetry"]
geos = ["dep:litegis", "dep:geos"]
geos-static = ["litegis/static", "dep:geos"]
pg = ["dep:trailbase-pg-schema", "trailbase-sqlite/generic"]
pg-test = ["pg"]
wasm = ["dep:trailbase-wasm-runtime-axum", "dep:trailbase-wasm-runtime-host"]
# Enable axum's "ws" feature: https://doc.rust-lang.org/cargo/reference/features.html#dependency-features
ws = ["axum/ws"]

[dependencies]
aes-gcm-siv = "0.12.1"
argon2 = { version = "^0.5.3", default-features = false, features = ["alloc", "password-hash"] }
askama = { workspace = true }
async-channel = "2.5.0"
async-trait = "0.1.92"
axum = { workspace = true }
axum-tracing-opentelemetry = { version = "0.38.0", optional = true }
base32 = "0.5.1"
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
client-ip = "0.2.1"
const_format = "0.2.36"
cron = { workspace = true }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem", "rand_core"] }
fallible-iterator = "0.3.0"
flume = { workspace = true }
form_urlencoded = "1.2.2"
futures-util = { workspace = true }
geos = { version = "11.1.1", default-features = false, features = ["geo", "json"], optional = true }
getrandom = "0.4.3"
governor = "0.10.4"
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = "0.1.20"
indexmap = "2.14.0"
init-tracing-opentelemetry = { version = "0.38.1", features = ["tracing_subscriber_ext", "metrics"], optional = true }
itertools = { workspace = true }
jsonschema = { version = "0.52.0", default-features = false }
jsonwebtoken = { workspace = true }
lazy_static = "1.5.0"
lettre = { version = "^0.11.23", default-features = false, features = ["tokio1-rustls-tls", "sendmail-transport", "smtp-transport", "builder"] }
litegis = { workspace = true, optional = true }
log = { workspace = true }
mini-moka = "0.10.3"
minijinja = { workspace = true }
oauth2 = { version = "5.0.0", default-features = false, features = ["rustls-tls"] }
object_store = { version = "0.14.1", default-features = false, features = ["aws", "fs"] }
once_cell = "1.21.4"
parking_lot = { workspace = true }
pin-project-lite = "0.2.17"
prost = { version = "^0.14.4", default-features = false }
prost-reflect = { version = "^0.16.5", default-features = false, features = ["derive", "text-format"] }
quick_cache = "0.7.0"
rand = { workspace = true }
regex = "1.13.1"
reqwest = { workspace = true }
rusqlite = { workspace = true }
rust-embed = { workspace = true }
scopeguard = "1.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
serde_path_to_error = "0.1.20"
serde_qs = { workspace = true }
serde_repr = "0.1.21"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
sqlformat = "0.5.0"
sqlite3-parser = { workspace = true }
thiserror = "2.0.20"
tokio = { workspace = true }
tokio-rustls = { workspace = true }
totp-rs = { version = "^6.0.0", features = ["gen_secret", "qr", "otpauth"] }
tower = "0.5.3"
tower-cookies = "0.11.0"
tower-http = { version = "^0.7.0", default-features = false, features = ["cors", "trace", "fs", "limit"] }
tower-service = { version = "0.3.3", default-features = false }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = { workspace = true }
tracing-opentelemetry-instrumentation-sdk = "0.38.1"
tracing-subscriber = { workspace = true }
trailbase-assets = { workspace = true }
trailbase-auth-config = { workspace = true }
trailbase-build = { workspace = true }
trailbase-extension = { workspace = true }
trailbase-pg-schema = { workspace = true, optional = true }
trailbase-qs = { workspace = true }
trailbase-reactive = { workspace = true }
trailbase-refinery = { workspace = true }
trailbase-schema = { workspace = true }
trailbase-sqlite = { workspace = true, default-features = false }
trailbase-sqlvalue = { workspace = true, features = ["rusqlite", "utoipa"] }
trailbase-wasm-common = { workspace = true }
trailbase-wasm-component-repo = { workspace = true }
trailbase-wasm-runtime-axum = { workspace = true, optional = true }
trailbase-wasm-runtime-host = { workspace = true, optional = true }
ts-rs = { workspace = true }
url = { version = "^2.5.8", default-features = false }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
validator = { version = "0.21.0", default-features = false }
walkdir = "2.5.0"

[build-dependencies]
trailbase-build = { workspace = true }

[dev-dependencies]
anyhow = "^1.0.104"
axum-test = "21.1.0"
criterion = { version = "0.8", features = ["html_reports", "async_tokio"] }
env_logger = { workspace = true }
indoc = "2.0.7"
pglite-oxide = "0.5.1"
quoted_printable = "0.5.2"
rcgen = "0.14.9"
schemars = "1.2.2"
temp-dir = "0.2.0"
tokio-metrics = "0.5.1"
tower = { version = "0.5.3", features = ["util"] }
trailbase-extension = { workspace = true }
