[package]
name = "collab-clicker-ssr-guest"
version = "0.0.0"
authors = ["someone"]
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
default = []
bundle = ["dep:trailbase-build"]

[dependencies]
regex = { version = "1.13.1", no-default-features = true, features = ["std"] }
rquickjs = { version = "0.13.0", features = ["rust-alloc", "loader", "futures"] }
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.151"
trailbase-wasm = { workspace = true }

[build-dependencies]
trailbase-build = { workspace = true, optional = true }
