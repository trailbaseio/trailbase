name: 'Setup Build'
description: 'Sets up the build/test environment on Ubuntu'

inputs:
  cache-key-suffix:
    description: "Scopes the Rust cache to the calling job (jobs built with different feature flags must not share a cached `target/`)"
    required: true
  toolchain-version:
    description: "Rust toolchain version to use."
    required: true

runs:
  using: "composite"
  steps:
    - name: Inspect Checkout
      shell: bash
      run: git describe --tags

    - name: Install Dependencies
      shell: bash
      run: |
        sudo apt-get update && \
          sudo apt-get install -y --no-install-recommends curl libssl-dev pkg-config libclang-dev protobuf-compiler libprotobuf-dev libgeos-dev

    - uses: ./.github/actions/setup_pnpm

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain-version }}
        components: rustfmt, clippy

    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: ${{ inputs.cache-key-suffix }}

    - name: Install fake sendmail
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/fakebin"
        cat > "$RUNNER_TEMP/fakebin/sendmail" <<'EOF'
        #!/usr/bin/env bash
        cat >/dev/null
        exit 0
        EOF
        chmod +x "$RUNNER_TEMP/fakebin/sendmail"
        echo "$RUNNER_TEMP/fakebin" >> "$GITHUB_PATH"
